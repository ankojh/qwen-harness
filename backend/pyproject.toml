[project]
name = "qwen-harness"
version = "0.1.0"
description = "A small, transparent local web UI for running and inspecting Qwen via MLX-LM."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "mlx-lm==0.32.2",
  "jinja2>=3.1,<4",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
